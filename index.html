<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Pantry &amp; Grocery</title>
<style>
:root{
  --green:#2e7d32; --green-d:#1b5e20; --green-l:#4caf50; --lime:#7cb342;
  --bg:#f4f6f2; --card:#ffffff; --ink:#20241f; --muted:#7a8574;
  --line:#e4e8de; --amber:#f0a202; --red:#e53935; --blue:#1e88e5;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); overscroll-behavior-y:none;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--green),var(--green-d));
  color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{font-size:20px;font-weight:800;letter-spacing:.3px;flex:1;display:flex;align-items:center;gap:8px}
.htitle .emoji{font-size:22px}
.hbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
.hbtn:active{background:rgba(255,255,255,.3)}
.searchwrap{margin-top:12px;position:relative;display:flex;align-items:center}
.searchwrap input{
  width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:none;
  background:rgba(255,255,255,.95);color:var(--ink);outline:none;
}
.searchwrap .sicon{position:absolute;left:12px;font-size:16px;opacity:.6}
.searchwrap .sclear{position:absolute;right:8px;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px;display:none}

/* ---------- Tabs ---------- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;
}
nav.tabs button .ti{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--green)}
nav.tabs button .badge{position:absolute;transform:translate(14px,-6px);background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700}
nav.tabs .tabbtn{position:relative}

/* ---------- Content ---------- */
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.cathead{
  display:flex;align-items:center;gap:8px;margin:18px 4px 8px;
}
.cathead .cname{font-weight:800;font-size:14px;color:var(--green-d);text-transform:uppercase;letter-spacing:.5px}
.cathead .cico{font-size:16px}
.cathead .cline{flex:1;height:2px;background:linear-gradient(90deg,var(--lime),transparent);border-radius:2px}
.cathead .ccount{font-size:12px;color:var(--muted);font-weight:600}

.card{
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  margin-bottom:8px;overflow:hidden;
}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px}
.item .thumb{
  width:44px;height:44px;border-radius:11px;flex:none;background:#eef2ea;
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;
}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.swatch{width:34px;height:34px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%, var(--scL) 0%, var(--sc) 52%, var(--scD) 100%);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.22),inset 0 1px 2px rgba(255,255,255,.5),0 0 0 1px rgba(0,0,0,.1);}
.swatch.gran{
  background-image:
    radial-gradient(circle at 28% 26%, rgba(255,255,255,.55) 0.6px, transparent 1.4px),
    radial-gradient(circle at 62% 40%, rgba(0,0,0,.18) 0.6px, transparent 1.4px),
    radial-gradient(circle at 42% 68%, rgba(255,255,255,.5) 0.6px, transparent 1.4px),
    radial-gradient(circle at 74% 66%, rgba(0,0,0,.16) 0.6px, transparent 1.4px),
    radial-gradient(circle at 34% 30%, var(--scL) 0%, var(--sc) 55%, var(--scD) 100%);
  background-size:6px 6px,7px 7px,5px 5px,8px 8px,100% 100%;}
.item .body{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:15.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.pill.cat{background:#e8f5e9;color:var(--green-d)}
.pill.warn{background:#fff3e0;color:#e65100}
.pill.bad{background:#ffebee;color:#c62828}
.pill.ok{background:#e8f5e9;color:#2e7d32}
.pill.info{background:#e3f2fd;color:#1565c0}
.pill.openpill{background:#ede7f6;color:#5e35b1;border:none;font-weight:700;cursor:pointer}
.pill.openpill:active{background:#d1c4e9}
.bar{height:7px;border-radius:6px;background:#e9ede6;overflow:hidden;margin-top:7px;max-width:150px}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green-l),var(--lime))}
.bar.low > i{background:linear-gradient(90deg,#ef5350,#e53935)}
.bar.mid > i{background:linear-gradient(90deg,#ffb300,#fb8c00)}
.item .act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.moveBtn{
  width:38px;height:38px;border-radius:11px;background:#e8f5e9;color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.moveBtn.togro{background:#e3f2fd;color:var(--blue)}
.moveBtn:active{transform:scale(.92)}

/* grocery checkbox */
.check{
  width:28px;height:28px;border-radius:9px;border:2.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;transition:.15s;
}
.check.done{background:var(--green-l);border-color:var(--green-l)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item.done .thumb{opacity:.5}

/* notes */
.note{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;position:relative}
.note .ntext{white-space:pre-wrap;font-size:15px;line-height:1.45}
.note .nmeta{font-size:11px;color:var(--muted);margin-top:8px}
.note .ndel{position:absolute;top:10px;right:10px;color:var(--muted);font-size:16px;width:28px;height:28px}

.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .e-ico{font-size:52px;opacity:.5}
.empty p{margin:12px 0 0;font-size:14px}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--green-l),var(--green));
  color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(46,125,50,.45);
}
.fab:active{transform:scale(.94)}
.fab.mic{right:18px;bottom:calc(154px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#42a5f5,#1e88e5);box-shadow:0 6px 16px rgba(30,136,229,.4);width:52px;height:52px;font-size:24px}
.fab.mic.listening{animation:pulse 1.1s infinite;background:linear-gradient(135deg,#ef5350,#e53935)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.5)}70%{box-shadow:0 0 0 16px rgba(229,57,53,0)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}

/* ---------- Modal / sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .25s ease;touch-action:pan-y;
}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:2px auto 10px;box-sizing:content-box;padding:9px 40px;background-clip:content-box;cursor:pointer}
.grab:active{background:var(--muted);background-clip:content-box}
.sheet h2{margin:4px 0 16px;font-size:19px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fafbf9;outline:none;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-l);background:#fff}
.field textarea{min-height:80px;resize:vertical}
.row2{display:flex;gap:10px}
.row2 > *{flex:1}
.seg{display:flex;gap:6px;background:#eef2ea;padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--green-d);box-shadow:var(--shadow)}
.btn{
  width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;
  background:var(--green);color:#fff;box-shadow:var(--shadow);margin-top:6px;
}
.btn:active{transform:scale(.98)}
.btn.sec{background:#eef2ea;color:var(--green-d)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.danger{background:#fdecea;color:var(--red)}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btnrow .btn{margin-top:0}

.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;accent-color:var(--green)}
.rng .rngval{font-weight:800;min-width:52px;text-align:right;color:var(--green-d)}

.photobox{
  border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:6px;background:#fafbf9;
}
.photobox .pv{width:120px;height:120px;border-radius:12px;object-fit:cover;display:none}
.chipbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:9px 12px;border-radius:11px;background:#eef2ea;font-weight:600;font-size:13px;color:var(--green-d);display:inline-flex;align-items:center;gap:6px}
.chip:active{background:#dce7d6}

.freshbox{background:#f1f8e9;border-radius:12px;padding:12px 14px;font-size:13px;color:#33691e;line-height:1.5;margin-top:6px}
.freshbox b{color:#1b5e20}
.freshbox.warn{background:#fff8e1;color:#e65100}
.freshbox.bad{background:#ffebee;color:#c62828}

/* camera */
#camView{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
#camView video{flex:1;width:100%;object-fit:cover}
#camView .cbar{padding:16px calc(16px) calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:#000;color:#fff}
#camView .shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4)}
#camView .cx{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:2;color:#fff;font-size:26px;width:44px;height:44px;background:rgba(0,0,0,.4);border-radius:50%}
#camView .chint{position:absolute;top:calc(20px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:13px;padding:0 60px;text-shadow:0 1px 3px #000}
#camView .cmode{color:#fff;font-size:13px;font-weight:700;opacity:.85;text-align:center;min-width:70px}
#camScanBox{position:absolute;top:35%;left:12%;right:12%;height:22%;border:2px solid rgba(255,255,255,.7);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{background:#20241f;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.25s;display:flex;align-items:center;gap:10px;width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.good{background:#2e7d32}
.toast.warn{background:#ef6c00}
.toast.bad{background:#c62828}
.toast .ti2{font-size:20px}

.sub-hint{font-size:12px;color:var(--muted);margin:-4px 4px 10px;line-height:1.4}
#voicePill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(220px + env(safe-area-inset-bottom));z-index:70;display:none;align-items:center;gap:10px;background:#20241f;color:#fff;padding:10px 12px 10px 16px;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:88vw}
#voicePill .vdot{width:11px;height:11px;border-radius:50%;background:#ef5350;flex:none;animation:micpulse 1.1s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(239,83,80,.6)}70%{box-shadow:0 0 0 10px rgba(239,83,80,0)}100%{box-shadow:0 0 0 0 rgba(239,83,80,0)}}
#voicePillText{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voicePillStop{background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:16px;flex:none}
#voicePillStop:active{background:rgba(255,255,255,.3)}
.voicehelp{background:#e3f2fd;border-radius:12px;padding:12px 14px;font-size:13px;color:#0d47a1;line-height:1.6;margin-top:4px}
.voicehelp code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:6px;font-weight:700}
.summary{display:flex;gap:10px;margin:4px 4px 14px}
.summary .scard{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-align:center;cursor:pointer;transition:.12s;border:2px solid transparent}
.summary .scard:active{transform:scale(.96)}
.summary .scard.on{border-color:var(--green-l);background:#f1f8e9}
.summary .snum{font-size:22px;font-weight:800;color:var(--green-d)}
.summary .slab{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.linkbtn{color:var(--green);font-weight:700;background:none}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle"><span class="emoji" id="hEmoji">🥫</span><span id="hTitle">Pantry</span></div>
    <button class="hbtn" id="btnClearChecked" title="Clear checked" style="display:none">🧹</button>
    <button class="hbtn" id="btnSort" title="Sort">⇅</button>
  </div>
  <div class="searchwrap">
    <span class="sicon">🔍</span>
    <input id="search" type="search" placeholder="Search pantry &amp; grocery…" autocomplete="off">
    <button class="sclear" id="sclear">✕</button>
  </div>
</header>

<main>
  <div class="view on" id="view-pantry"></div>
  <div class="view" id="view-grocery"></div>
  <div class="view" id="view-notes"></div>
</main>

<button class="fab mic" id="fabMic" title="Voice">🎙️</button>
<button class="fab" id="fabAdd" title="Add item">＋</button>

<nav class="tabs">
  <button class="tabbtn on" data-tab="pantry"><span class="ti">🥫</span>Pantry</button>
  <button class="tabbtn" data-tab="grocery"><span class="ti">🛒</span><span class="badge" id="groBadge" style="display:none">0</span>Grocery</button>
  <button class="tabbtn" data-tab="notes"><span class="ti">📝</span>Notes</button>
</nav>

<!-- ============ Add / Edit item sheet ============ -->
<div class="scrim" id="itemScrim">
  <div class="sheet" id="itemSheet">
    <div class="grab"></div>
    <h2 id="itemSheetTitle">Add Item</h2>

    <div class="photobox" id="photoBox">
      <img class="pv" id="photoPreview" alt="">
      <div id="photoHint">📷 No photo yet</div>
      <div class="chipbtns">
        <button class="chip" id="chipScanItem">📸 Scan barcode</button>
        <button class="chip" id="chipFindImg">🔎 Find image</button>
        <button class="chip" id="chipPhoto">🖼️ Add photo</button>
      </div>
    </div>
    <div class="sub-hint">“Find image” looks up a product photo by name (Open Food Facts). Scanning a barcode is more accurate. You can also take your own photo.</div>

    <div class="field">
      <label>Item name</label>
      <input id="fName" placeholder="e.g. Almond Milk" autocomplete="off">
    </div>

    <div class="field">
      <label>Category <span id="autoCatTag" style="color:var(--green);text-transform:none;letter-spacing:0"></span></label>
      <select id="fCat"></select>
    </div>

    <div class="field">
      <label>Where it lives</label>
      <div class="seg" id="segStore">
        <button data-v="pantry" class="on">🗄️ Pantry</button>
        <button data-v="fridge">❄️ Fridge</button>
        <button data-v="freezer">🧊 Freezer</button>
      </div>
    </div>

    <div class="field">
      <label>Amount left · <span id="pctLabel">100%</span></label>
      <div class="rng">
        <input type="range" id="fPct" min="0" max="100" step="5" value="100">
        <span class="rngval" id="fPctVal">100%</span>
      </div>
    </div>

    <div class="field">
      <label>Quantity note (optional)</label>
      <input id="fQty" placeholder="e.g. 2 boxes · large white and blue" autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label>Expiration date</label>
        <input id="fExp" type="date">
      </div>
      <div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end">
        <button class="chip" id="chipScanDate" style="margin-bottom:14px">📅 Scan</button>
      </div>
    </div>

    <div class="field">
      <label>Opened? (starts the freshness timer)</label>
      <div class="row2" style="align-items:center">
        <input id="fOpen" type="date">
        <button class="chip" id="chipOpenToday" style="flex:0 0 auto">📂 Opened today</button>
      </div>
    </div>
    <div id="freshInfo"></div>

    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="fNote" placeholder="Any details…"></textarea>
    </div>

    <button class="btn" id="btnSaveItem">Save Item</button>
    <div class="btnrow" id="editExtraBtns" style="display:none">
      <button class="btn sec" id="btnMoveItem">Move to Grocery</button>
      <button class="btn danger" id="btnDeleteItem">Delete</button>
    </div>
    <button class="btn ghost" id="btnCancelItem">Cancel</button>
  </div>
</div>

<!-- ============ Note sheet ============ -->
<div class="scrim" id="noteScrim">
  <div class="sheet">
    <div class="grab"></div>
    <h2>New Note</h2>
    <div class="field">
      <textarea id="noteText" placeholder="Write anything… shopping reminders, meal ideas, brands to buy…" style="min-height:140px"></textarea>
    </div>
    <button class="btn" id="btnSaveNote">Save Note</button>
    <button class="btn ghost" id="btnCancelNote">Cancel</button>
  </div>
</div>

<!-- ============ Voice listening pill (compact, no modal) ============ -->
<div id="voicePill">
  <span class="vdot"></span>
  <span id="voicePillText">Listening…</span>
  <button id="voicePillStop">Stop</button>
</div>

<!-- ============ Camera ============ -->
<div id="camView">
  <button class="cx" id="camClose">✕</button>
  <div class="chint" id="camHint">Point at the barcode</div>
  <video id="camVideo" playsinline muted autoplay></video>
  <div id="camScanBox"></div>
  <div class="cbar">
    <div class="cmode" id="camModeLabel">BARCODE</div>
    <button class="shutter" id="camShutter"></button>
    <div class="cmode" id="camCancel2" style="opacity:.7">Cancel</div>
  </div>
</div>

<div id="toast"></div>
<canvas id="workCanvas" style="display:none"></canvas>

<script>
/* ============================================================
   PANTRY & GROCERY  — single-file app
   ============================================================ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ---------- Categories ---------- */
const CATS=[
  ["Protein","🥩"],["Fruit/Veggies","🥬"],["Dairy/Non-Dairy","🥛"],["Baking","🧁"],
  ["Seasonings","🌿"],["Cooking Spices","🧂"],["Sauces/Oils","🫙"],

];
function spiceColor(name){
  const n=(name||"").toLowerCase();
  if(/\boil\b|spray|paste|sauce|\begg\b/.test(n)) return null;  // oils/pastes/sauces/eggs aren't loose powders → use an emoji
  for(const [kws,c] of SPICE_COLORS){ for(const kw of kws){ if(n.includes(kw)) return c; } }
  return null;
}
// compute light/base/dark hex stops for the swatch (avoids CSS color-mix, unsupported on older iOS Safari)
function _hx2(n){ n=Math.max(0,Math.min(255,Math.round(n))); return n.toString(16).padStart(2,"0"); }
function shades(hex){
  hex=hex.replace("#",""); if(hex.length===3) hex=hex.split("").map(c=>c+c).join("");
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const L=c=>c+(255-c)*0.45, D=c=>c*0.66;
  return {L:`#${_hx2(L(r))}${_hx2(L(g))}${_hx2(L(b))}`, B:`#${hex}`, D:`#${_hx2(D(r))}${_hx2(D(g))}${_hx2(D(b))}`};
}
// granular (visible grains) vs fine powder — drives the swatch texture
const GRANULAR=["granulated","white sugar","brown sugar","raw sugar","salt","sesame","seed","fennel","coriander","mung","cube","kelp","peppercorn","black pepper","star anise","clove","cardamon","cardamom","bay leaf","flake","chili pepper"];
function isGranular(name){ const n=(name||"").toLowerCase(); if(/icing|powdered|powder|flour|starch|paprika|turmeric|cayenne|curry|cumin|cinnamon/.test(n)) return false; return GRANULAR.some(k=>n.includes(k)); }

function itemThumb(it){
  if(it.photo) return `<img src="${it.photo}" alt="">`;
  const col=spiceColor(it.name);
  if(col){ const s=shades(col); return `<span class="swatch ${isGranular(it.name)?'gran':''}" style="--scL:${s.L};--sc:${s.B};--scD:${s.D}"></span>`; }
  return itemEmoji(it.name,it.category);
}

/* ---------- State ---------- */
let state={items:[],notes:[],settings:{sort:"category"}};
const KEY="pantry_grocery_v1";
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){state=Object.assign(state,JSON.parse(raw));}}catch(e){}
  if(!state.items.length && !localStorage.getItem(KEY+"_seeded")){ seed(); localStorage.setItem(KEY+"_seeded","1"); }
  seedGroceryV1();
  migrateCatV2();
}

/* One-time: rename old "Spices" category to "Seasonings" for existing users */

  if(localStorage.getItem(KEY+"_cat_v2")) return;
  let changed=false;
  state.items.forEach(i=>{ if(i.category==="Spices"){ i.category="Seasonings"; changed=true; } });
  localStorage.setItem(KEY+"_cat_v2","1");
  if(changed) save();
}

/* ---------- Freshness computation ---------- */
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function freshStatus(item){
  // Returns {useBy, daysLeft, label, level} or null
  let useBy=null, source=null;
  if(item.opened){
    const sl=shelfLife(item.name);
    if(sl){
      const d=sl[item.store]??sl.pantry;
      if(d>0){ const dt=new Date(item.opened); dt.setDate(dt.getDate()+d); useBy=dt.toISOString().slice(0,10); source="opened"; }
    }
  }
  if(item.exp){ if(!useBy || item.exp<useBy){ useBy=item.exp; source="exp"; } }
  if(!useBy) return null;
  const left=daysBetween(todayISO(),useBy);
  let level="ok",label="";
  if(left<0){ level="bad"; label="Expired "+(-left)+"d ago"; }
  else if(left===0){ level="bad"; label="Use today"; }
  else if(left<=3){ level="warn"; label=left+"d left"; }
  else if(left<=14){ level="warn"; label=left+"d left"; }
  else { level="ok"; label=left+"d left"; }
  return {useBy,daysLeft:left,label,level,source};
}

let currentTab="pantry";
let searchQ="";
let activeFilter=null; // null | 'low' | 'expiring'

function itemMatchesSearch(it){
  if(!searchQ) return true;
  return (it.name+" "+it.category+" "+(it.qty||"")).toLowerCase().includes(searchQ);
}

function pctClass(p){ if(p==null) return ""; if(p<=25) return "low"; if(p<=60) return "mid"; return ""; }

function itemCardHTML(it,mode){
  const fs=freshStatus(it);
  const catIco=CAT_ICON[it.category]||"📦";
  const thumb=itemThumb(it);
  let sub=[];
  if(mode==="grocery"){ sub.push(`<span class="pill cat">${catIco} ${it.category}</span>`); }
  if(it.qty) sub.push(`<span>${escapeHtml(it.qty)}</span>`);
  if(fs){ sub.push(`<span class="pill ${fs.level==='bad'?'bad':fs.level==='warn'?'warn':'ok'}">${fs.level==='ok'?'🟢':fs.level==='warn'?'⏳':'⚠️'} ${fs.label}</span>`); }
  if(mode!=="grocery" && it.opened) sub.push(`<span class="pill info">📂 Opened</span>`);
  else if(mode!=="grocery" && !it.opened && shelfLife(it.name)) sub.push(`<button class="pill openpill" data-open="${it.id}">📂 Mark open</button>`);
  if(it.store && it.store!=="pantry" && mode!=="grocery") sub.push(`<span class="pill info">${it.store==='fridge'?'❄️ Fridge':'🧊 Freezer'}</span>`);

  const barHTML=(it.percent!=null)?`<div class="bar ${pctClass(it.percent)}"><i style="width:${it.percent}%"></i></div>`:"";

  if(mode==="grocery"){
    return `<div class="item ${it.checked?'done':''}" data-id="${it.id}">
      <button class="check ${it.checked?'done':''}" data-check="${it.id}">${it.checked?'✓':''}</button>
      <div class="body" data-edit="${it.id}">
        <div class="nm">${escapeHtml(it.name)}</div>
        <div class="sub">${sub.join("")}</div>
        ${it.percent!=null?`<div class="sub" style="margin-top:2px"><span class="pill warn">${it.percent}% left</span></div>`:""}
      </div>
      <div class="act"><button class="moveBtn" data-move="${it.id}" title="Back to pantry">↩︎</button></div>
    </div>`;
  }
  // pantry
  return `<div class="item" data-id="${it.id}">
    <div class="thumb" data-edit="${it.id}">${thumb}</div>
    <div class="body" data-edit="${it.id}">
      <div class="nm">${escapeHtml(it.name)}</div>
      <div class="sub">${sub.join("")}</div>
      ${barHTML}
    </div>
    <div class="act"><button class="moveBtn togro" data-move="${it.id}" title="Need to buy">🛒</button></div>
  </div>`;
}

function renderPantry(){
  const host=$("#view-pantry");
  let items=state.items.filter(i=>i.location==="pantry" && itemMatchesSearch(i));
  if(activeFilter==="low") items=items.filter(i=>i.percent!=null && i.percent<=25);
  else if(activeFilter==="expiring") items=items.filter(i=>{const f=freshStatus(i);return f&&f.daysLeft<=3;});

  // summary (from full pantry; tap a card to filter)
  const pantryAll=state.items.filter(i=>i.location==="pantry");
  const total=pantryAll.length;
  const low=pantryAll.filter(i=>i.percent!=null && i.percent<=25).length;
  const expiring=pantryAll.filter(i=>{const f=freshStatus(i);return f&&f.daysLeft<=3;}).length;
  let summary="";
  if(!searchQ){
    summary=`<div class="summary">
      <div class="scard ${!activeFilter?'on':''}" data-filter="all"><div class="snum">${total}</div><div class="slab">All items</div></div>
      <div class="scard ${activeFilter==='low'?'on':''}" data-filter="low"><div class="snum" style="color:${low?'#e53935':'#2e7d32'}">${low}</div><div class="slab">Running low</div></div>
      <div class="scard ${activeFilter==='expiring'?'on':''}" data-filter="expiring"><div class="snum" style="color:${expiring?'#ef6c00':'#2e7d32'}">${expiring}</div><div class="slab">Expiring</div></div>
    </div>`;
  }

  if(!items.length){
    const msg=activeFilter==="low"?"Nothing is running low 🎉":activeFilter==="expiring"?"Nothing is expiring soon 🎉":(searchQ?"No pantry items match your search.":"Your pantry is empty. Tap ＋ to add items.");
    host.innerHTML=summary+emptyHTML(searchQ?"🔍":activeFilter?"✅":"🥫", msg);
    return;
  }

  let html=summary;

  if(state.settings.sort==="category"){
    for(const cat of CAT_ORDER){
      const list=items.filter(i=>i.category===cat);
      if(!list.length) continue;
      list.sort((a,b)=>a.name.localeCompare(b.name));
      html+=catHeadHTML(cat,list.length);
      html+=`<div class="card">`+list.map(i=>itemCardHTML(i,"pantry")).join("")+`</div>`;
    }
    // uncategorized cats not in order
    const others=items.filter(i=>!CAT_ORDER.includes(i.category));
    if(others.length){ html+=catHeadHTML("Other",others.length); html+=`<div class="card">`+others.map(i=>itemCardHTML(i,"pantry")).join("")+`</div>`; }
  }else{
    const sorted=[...items];
    if(state.settings.sort==="name") sorted.sort((a,b)=>a.name.localeCompare(b.name));
    if(state.settings.sort==="low") sorted.sort((a,b)=>(a.percent??999)-(b.percent??999));
    if(state.settings.sort==="expiry") sorted.sort((a,b)=>{const fa=freshStatus(a),fb=freshStatus(b);return (fa?fa.daysLeft:9999)-(fb?fb.daysLeft:9999);});
    html+=`<div class="card">`+sorted.map(i=>itemCardHTML(i,"pantry")).join("")+`</div>`;
  }
  host.innerHTML=html;
}

function renderGrocery(){
  const host=$("#view-grocery");
  const items=state.items.filter(i=>i.location==="grocery" && itemMatchesSearch(i));
  if(!items.length){ host.innerHTML=emptyHTML(searchQ?"🔍":"🛒", searchQ?"No grocery items match.":"Your grocery list is empty.<br>Tap 🛒 on any pantry item, or use voice."); return; }
  // sort: unchecked first, grouped by category
  let html="";
  const active=items.filter(i=>!i.checked), done=items.filter(i=>i.checked);
  const group=(arr)=>{
    let h="";
    for(const cat of CAT_ORDER){
      const list=arr.filter(i=>i.category===cat);
      if(!list.length) continue;
      list.sort((a,b)=>a.name.localeCompare(b.name));
      h+=catHeadHTML(cat,list.length);
      h+=`<div class="card">`+list.map(i=>itemCardHTML(i,"grocery")).join("")+`</div>`;
    }
    return h;
  };
  html+=group(active);
  if(done.length){
    html+=`<div class="cathead"><span class="cico">✅</span><span class="cname" style="color:var(--muted)">In cart (${done.length})</span><span class="cline"></span></div>`;
    html+=`<div class="card">`+done.map(i=>itemCardHTML(i,"grocery")).join("")+`</div>`;
  }
  host.innerHTML=html;
}

function renderNotes(){
  const host=$("#view-notes");
  if(!state.notes.length){ host.innerHTML=emptyHTML("📝","No notes yet. Tap ＋ to jot one down."); return; }
  host.innerHTML=state.notes.map(n=>`
    <div class="note">
      <button class="ndel" data-delnote="${n.id}">🗑️</button>
      <div class="ntext">${escapeHtml(n.text)}</div>
      <div class="nmeta">${new Date(n.ts).toLocaleString()}</div>
    </div>`).join("");
}

function catHeadHTML(cat,count){
  return `<div class="cathead"><span class="cico">${CAT_ICON[cat]||"📦"}</span><span class="cname">${escapeHtml(cat)}</span><span class="cline"></span><span class="ccount">${count}</span></div>`;
}
function emptyHTML(ico,msg){ return `<div class="empty"><div class="e-ico">${ico}</div><p>${msg}</p></div>`; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderAll(){
  renderPantry(); renderGrocery(); renderNotes();
  const gc=state.items.filter(i=>i.location==="grocery" && !i.checked).length;
  const badge=$("#groBadge");
  if(gc>0){ badge.style.display="flex"; badge.textContent=gc; } else badge.style.display="none";

document.addEventListener("click",e=>{
  const filt=e.target.closest("[data-filter]");
  if(filt){ const f=filt.dataset.filter; activeFilter = (f==="all"||activeFilter===f) ? null : f; renderPantry(); return; }
  const openb=e.target.closest("[data-open]");
  if(openb){ markOpened(openb.dataset.open); return; }
  const move=e.target.closest("[data-move]");
  if(move){ moveItem(move.dataset.move); return; }
  const check=e.target.closest("[data-check]");
  if(check){ toggleCheck(check.dataset.check); return; }
  const edit=e.target.closest("[data-edit]");
  if(edit){ openItemSheet(edit.dataset.edit); return; }
  const dn=e.target.closest("[data-delnote]");
  if(dn){ if(confirm("Delete this note?")){ state.notes=state.notes.filter(n=>n.id!==dn.dataset.delnote); save(); renderNotes(); } return; }
});

function getItem(id){ return state.items.find(i=>i.id===id); }
function markOpened(id){
  const it=getItem(id); if(!it) return;
  it.opened=todayISO();
  save(); renderAll();
  const fs=freshStatus(it);
  toast(fs?`📂 “${it.name}” opened · best used within ${fs.daysLeft} day(s)`:`📂 “${it.name}” marked opened`,"good");
}
function moveItem(id){
  const it=getItem(id); if(!it) return;
  it.location = it.location==="pantry" ? "grocery" : "pantry";
  if(it.location==="grocery") it.checked=false;
  save(); renderAll();
  toast(it.location==="grocery"?`🛒 “${it.name}” added to Grocery`:`↩︎ “${it.name}” back in Pantry`,"good");
}
function toggleCheck(id){ const it=getItem(id); if(!it) return; it.checked=!it.checked; save(); renderAll(); }

/* clear checked */
$("#btnClearChecked").addEventListener("click",()=>{
  const checked=state.items.filter(i=>i.location==="grocery"&&i.checked);
  if(!checked.length) return;
  if(!confirm(`Move ${checked.length} checked item(s) back to the pantry as restocked (100%)?`)) return;
  checked.forEach(i=>{ i.location="pantry"; i.checked=false; if(i.percent!=null) i.percent=100; });

function updateFreshInfo(){
  const box=$("#freshInfo");
  const nm=$("#fName").value.trim()||"item";
  const opened=$("#fOpen").value;
  const exp=$("#fExp").value;
  const tmp={name:nm,store:storeVal,opened:opened||null,exp:exp||null};
  const sl=shelfLife(nm);
  let html="";
  if(opened && sl){
    const d=sl[storeVal]??sl.pantry;
    if(d>0){
      const dt=new Date(opened); dt.setDate(dt.getDate()+d);
      html+=`Once opened, keep in the <b>${storeVal}</b> for about <b>${d} days</b> → best used by <b>${dt.toISOString().slice(0,10)}</b>.`;
    }else{
      html+=`Best stored elsewhere once opened — the ${storeVal} isn't ideal for this item.`;
    }
  }else if(sl && !opened){
    const parts=[];
    if(sl.fridge)parts.push(`fridge ~${sl.fridge}d`);
    if(sl.freezer)parts.push(`freezer ~${sl.freezer}d`);
    if(sl.pantry)parts.push(`pantry ~${sl.pantry}d`);
    html+=`💡 Once opened: ${parts.join(" · ")}. Set the “Date opened” to start the timer.`;
  }
  const fs=freshStatus(tmp);
  if(fs){ box.className="freshbox "+(fs.level==="bad"?"bad":fs.level==="warn"?"warn":""); box.innerHTML=(html?html+"<br>":"")+`⏱️ <b>${fs.label}</b> (use by ${fs.useBy})`; }
  else if(html){ box.className="freshbox"; box.innerHTML=html; }
  else { box.className=""; box.innerHTML=""; }
}

// compress an image element/canvas to small jpeg dataURL
function toThumb(imgOrCanvas,max=360,q=0.62){
  const c=$("#workCanvas");
  const w=imgOrCanvas.videoWidth||imgOrCanvas.naturalWidth||imgOrCanvas.width;
  const h=imgOrCanvas.videoHeight||imgOrCanvas.naturalHeight||imgOrCanvas.height;
  const scale=Math.min(1,max/Math.max(w,h));
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  c.getContext("2d").drawImage(imgOrCanvas,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

// Barcode scanning via native BarcodeDetector
async function startBarcodeScan(){
  if(!("BarcodeDetector" in window)){
    $("#camHint").textContent="Barcode scanner not supported here — tap shutter to take a photo instead";
    return;
  }
  try{
    barcodeDetector=barcodeDetector||new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
  }catch(e){ return; }
  const tick=async()=>{
    if(!camStream) return;
    try{
      const codes=await barcodeDetector.detect(camVideo);
      if(codes && codes.length){
        const code=codes[0].rawValue;
        closeCamera();
        lookupBarcode(code);

  };
  scanLoop=requestAnimationFrame(tick);
}

// Open Food Facts lookup (free, no key)

  toast("🔎 Looking up "+code+"…","good");
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,categories_tags,image_front_small_url`);
    const j=await r.json();
    if(j.status===1 && j.product){
      const p=j.product;
      const nm=[p.brands?p.brands.split(",")[0]:"",p.product_name].filter(Boolean).join(" ").trim() || ("Product "+code);
      $("#fName").value=nm;

      $("#autoCatTag").textContent=" → auto: "+$("#fCat").value;
      if(p.image_front_small_url){ pendingPhoto=p.image_front_small_url; showPhoto(pendingPhoto); }
      updateFreshInfo();

}

function guessCatFromOFF(tags){
  if(!tags) return null;
  const t=tags.join(" ");
  const map=[["milk|dairy|cheese|yogurt|butter","Dairy/Non-Dairy"],["meat|fish|seafood|egg|poultry","Protein"],
    ["vegetable|fruit|produce","Fruit/Veggies"],
    ["sauce|condiment|ketchup|mustard|mayonnaise","Condiments"],["oil|vinegar","Sauces/Oils"],
    ["spice|seasoning|herb","Seasonings"],["pasta|noodle|rice|cereal|grain","Pasta/Grains/Noodles"],
    ["frozen","Frozen"],["beverage|drink|water|juice|soda","Beverages"],["sugar|flour|baking|dessert","Baking"],
    ["canned|soup|tomato","Canned/Soup"],["dried|dry","Dried"],["supplement|protein-powder","Supplements"]];
  for(const [re,c] of map){ if(new RegExp(re).test(t)) return c; }
  return null;
}

// Crop to the on-screen scan box, upscale 2.2×, grayscale + contrast + soft threshold → much cleaner OCR
function captureDateRegion(){
  const v=camVideo, vw=v.videoWidth||1280, vh=v.videoHeight||720;
  const bx=Math.round(vw*0.06), by=Math.round(vh*0.30), bw=Math.round(vw*0.88), bh=Math.round(vh*0.34);
  const scale=2.2;
  const c=document.createElement("canvas"); c.width=Math.round(bw*scale); c.height=Math.round(bh*scale);
  const ctx=c.getContext("2d");
  ctx.drawImage(v, bx,by,bw,bh, 0,0,c.width,c.height);
  try{
    const img=ctx.getImageData(0,0,c.width,c.height), D=img.data, contrast=1.5;
    for(let i=0;i<D.length;i+=4){
      let g=0.299*D[i]+0.587*D[i+1]+0.114*D[i+2];
      g=(g-128)*contrast+128;                 // boost contrast
      g=g<100?0:(g>165?255:g);                // soft threshold to black/white
      D[i]=D[i+1]=D[i+2]=g;
    }
    ctx.putImageData(img,0,0);
  }catch(e){}
  return c.toDataURL("image/png");
}

/* ----- OCR expiry date via Tesseract.js (lazy CDN load) ----- */
let tessLoaded=false;
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(tessLoaded && window.Tesseract) return res();
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=()=>{ tessLoaded=true; res(); };
    s.onerror=()=>rej();
    document.head.appendChild(s);
  });
}
async function ocrDate(dataUrl){
  toast("🔎 Reading date…","good");
  try{
    await loadTesseract();
    let text="";
    try{
      // worker lets us restrict characters to those found in dates → big accuracy win
      const worker=await Tesseract.createWorker("eng");
      await worker.setParameters({
        tessedit_char_whitelist:"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz /.:-",
        tessedit_pageseg_mode:"6"
      });
      const r=await worker.recognize(dataUrl); text=r.data.text||"";
      await worker.terminate();
    }catch(e){
      const r=await Tesseract.recognize(dataUrl,"eng"); text=r.data.text||"";
    }
    const iso=parseDate(text);
    if(iso){ $("#fExp").value=iso; updateFreshInfo(); toast("📅 Found expiry: "+iso,"good"); }
    else { toast("Couldn't read the date clearly — frame just the date & try again, or type it","warn"); }
  }catch(e){ toast("OCR unavailable (offline?) — type the date","warn"); }
}
// Robust parser: handles 19 AUG 2026 · AUG 2026 · 2026-08-19 · 19/08/2026 · 08/2026 · full month names · BB/EXP prefixes
function parseDate(raw){
  const t=(raw||"").toUpperCase().replace(/[^0-9A-Z]+/g," ").trim();
  const M={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,SEPT:9,OCT:10,NOV:11,DEC:12,
    JANUARY:1,FEBRUARY:2,MARCH:3,APRIL:4,JUNE:6,JULY:7,AUGUST:8,SEPTEMBER:9,OCTOBER:10,NOVEMBER:11,DECEMBER:12};
  const Y=y=>{y=+y; return y<100?y+2000:y;};
  let m,r;
  if((m=t.match(/(\d{1,2})\s*([A-Z]{3,9})\s*(\d{2,4})/))&&M[m[2]]&&(r=fmt(Y(m[3]),M[m[2]],+m[1]))) return r;        // DD MMM YYYY
  if((m=t.match(/([A-Z]{3,9})\s*(\d{4})(?!\d)/))&&M[m[1]]) return fmt(+m[2],M[m[1]],1);                              // MMM YYYY (before MMM DD, so "AUG 2026" isn't split)
  if((m=t.match(/([A-Z]{3,9})\s+(\d{1,2})\s+(\d{2,4})/))&&M[m[1]]&&(r=fmt(Y(m[3]),M[m[1]],+m[2]))) return r;        // MMM DD YYYY
  if((m=t.match(/(20\d{2})\s*(\d{1,2})\s*(\d{1,2})/))&&(r=fmt(+m[1],+m[2],+m[3]))) return r;                         // YYYY MM DD
  if((m=t.match(/(\d{1,2})\s+(\d{1,2})\s+(\d{2,4})/))){ let a=+m[1],b=+m[2],d,mo; if(a>12){d=a;mo=b;}else if(b>12){d=b;mo=a;}else{d=a;mo=b;} if((r=fmt(Y(m[3]),mo,d))) return r; } // DD MM YYYY
  if((m=t.match(/(\d{1,2})\s+(20\d{2})/))) return fmt(+m[2],+m[1],1);                                                 // MM YYYY
  return null;
}
function fmt(y,mo,d){ if(!(y>=2000&&y<=2100)||mo<1||mo>12||d<1||d>31)return null; return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

/* ============================================================
   VOICE COMMANDS  (Web Speech API)
   ============================================================ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, wantListen=false, recogRunning=false, watchdog=null, vlabelT=null;

// Tapping the mic FAB toggles listening — no modal, no text box.
function micToggle(){ wantListen ? voiceStop() : voiceStart(); }
$("#fabMic").addEventListener("click",micToggle);
$("#voicePillStop").addEventListener("click",voiceStop);

function showPill(t){ const p=$("#voicePill"); if(p){ $("#voicePillText").textContent=t; p.style.display="flex"; } }
function hidePill(){ const p=$("#voicePill"); if(p) p.style.display="none"; }
function vlabel(t){ showPill(t); clearTimeout(vlabelT); vlabelT=setTimeout(()=>{ if(wantListen) showPill("🎧 Listening…"); },2600); }

function voiceStart(){
  if(!SR){ toast("Voice needs Chrome or Android (not supported here)","warn"); return; }
  if(wantListen) return;
  wantListen=true;
  $("#fabMic").classList.add("listening");
  showPill("🎧 Listening…");
  if(!localStorage.getItem("voice_hint")){ toast('Say: “no more eggs” · “25% left on rice” · “check butter”',"good"); localStorage.setItem("voice_hint","1"); }
  spinUp();
  clearInterval(watchdog);
  watchdog=setInterval(()=>{ if(wantListen && !recogRunning) spinUp(); },2500); // revive if the engine dies
}
function spinUp(){
  if(!wantListen) return;
  try{ recog=new SR(); }catch(e){ return; }           // fresh recognizer each cycle = far more stable
  recog.lang="en-US"; recog.continuous=true; recog.interimResults=false; recog.maxAlternatives=3;
  recog.onstart=()=>{ recogRunning=true; };
  recog.onresult=(ev)=>{
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal){ const t=ev.results[i][0].transcript.trim(); if(t) handleVoice(t.toLowerCase(), t); }
    }
  };
  recog.onerror=(e)=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("Microphone blocked — enable mic access for this site","bad"); voiceStop(); }
    // no-speech / aborted / network: ignore — onend + watchdog restart
  };
  recog.onend=()=>{ recogRunning=false; if(wantListen){ try{ recog.start(); }catch(e){ /* watchdog will retry with a fresh one */ } } };
  try{ recog.start(); }catch(e){ /* start race — watchdog recovers */ }
}
function voiceStop(){
  wantListen=false; recogRunning=false;
  clearInterval(watchdog); clearTimeout(vlabelT);
  if(recog){ try{ recog.onend=null; recog.stop(); }catch(e){} recog=null; }
  $("#fabMic").classList.remove("listening");
  hidePill();
}

function findItemByName(q){
  q=q.trim().toLowerCase();
  if(!q) return null;
  let it=state.items.find(i=>i.name.toLowerCase()===q);
  if(it) return it;
  it=state.items.find(i=>i.name.toLowerCase().includes(q));
  if(it) return it;
  // match by significant words
  const words=q.split(/\s+/).filter(w=>w.length>2);
  return state.items.find(i=>words.some(w=>i.name.toLowerCase().includes(w)))||null;
}

function handleVoice(t, original){
  // normalize number words
  const numWords={one:1,two:2,three:3,four:4,five:5,ten:10,twenty:20,quarter:25,half:50,fifty:50,twentyfive:25,hundred:100,full:100,empty:0};
  let m;

  // "check X" / "do i have X" / "is X available"
  m=t.match(/(?:check|do i have|is there|is|got)\s+(.*?)(?:\s+available|\s+in (?:the )?pantry)?$/);
  if(t.startsWith("check")||t.startsWith("do i have")||t.startsWith("is there")){
    const q=(t.replace(/^(check|do i have|is there)\s+/,"").replace(/\s+(available|in (the )?pantry)$/,"")).trim();
    const it=findItemByName(q);
    if(it){
      const where=it.location==="pantry"?"in your pantry":"on your grocery list";
      const amt=it.percent!=null?` — ${it.percent}% left`:"";
      speak(`Yes, ${it.name} is ${where}${amt}.`);
      vlabel(`✅ ${it.name} is ${where}${amt}`);
      toast(`✅ ${it.name} is ${where}${amt}`,"good");
    }else{
      speak(`No, I couldn't find ${q} in your pantry.`);
      vlabel(`❌ “${q}” not found`);
      toast(`❌ “${q}” is not in your pantry`,"warn");
    }
    return;
  }

  // "X percent left on Y"  /  "Y is at X percent"
  m=t.match(/(\d{1,3}|quarter|half|full|empty)\s*(?:percent|%)?\s*(?:left)?\s*(?:on|of|for)\s+(.+)/);
  if(!m) m=t.match(/(.+?)\s+(?:is|are)\s+(?:at\s+)?(\d{1,3}|quarter|half|full|empty)\s*(?:percent|%)/);
  if(m){
    let pct, name;
    if(/^\d/.test(m[1])||numWords[m[1]]!=null){ pct=numWords[m[1]]!=null?numWords[m[1]]:parseInt(m[1],10); name=m[2]; }
    else { name=m[1]; pct=numWords[m[2]]!=null?numWords[m[2]]:parseInt(m[2],10); }
    pct=Math.max(0,Math.min(100,pct));
    const it=findItemByName(name);
    if(it){
      it.percent=pct;
      if(pct<=25 && it.location==="pantry"){ it.location="grocery"; it.checked=false; }
      save(); renderAll();
      const added=pct<=25?" and added it to your grocery list":"";
      speak(`Set ${it.name} to ${pct} percent${added}.`);
      vlabel(`✅ ${it.name} → ${pct}%${added}`);
      toast(`✅ ${it.name} set to ${pct}%${added}`,"good");
    }else{
      speak(`I couldn't find ${name}.`);
      toast(`❌ “${name.trim()}” not found`,"warn");
    }
    return;
  }

  // "no more X" / "out of X" / "ran out of X" -> move to grocery
  m=t.match(/(?:no more|out of|ran out of|need|buy|add to (?:grocery|shopping)(?: list)?)\s+(.+)/);
  if(/^(no more|out of|ran out of)/.test(t)){
    const name=t.replace(/^(no more|out of|ran out of)\s+/,"").trim();
    const it=findItemByName(name);
    if(it){
      it.location="grocery"; it.checked=false; if(it.percent!=null)it.percent=0;
      save(); renderAll();
      speak(`${it.name} moved to your grocery list.`);
      vlabel(`🛒 ${it.name} → grocery list`);
      toast(`🛒 ${it.name} added to grocery list`,"good");
    }else{
      // add as new grocery item
      const cat=autoCategory(name);
      state.items.push({id:uid(),name:titleCase(name),category:cat,location:"grocery",percent:null,qty:"",checked:false,photo:null,exp:null,opened:null,store:"pantry",note:""});
      save(); renderAll();
      speak(`Added ${name} to your grocery list.`);
      toast(`🛒 “${titleCase(name)}” added to grocery (${cat})`,"good");
    }
    return;
  }

  // "add X" / "buy X" / "need X" -> add item (grocery if 'buy/need', pantry if 'add')
  m=t.match(/^(add|buy|need|i need|get)\s+(.+)/);
  if(m){
    const name=m[2].trim();
    const toGro=/^(buy|need|i need|get)/.test(t);
    const existing=findItemByName(name);
    if(existing){
      speak(`${existing.name} is already in your ${existing.location}.`);
      toast(`⚠️ “${existing.name}” already in ${existing.location}`,"warn"); return;
    }
    const cat=autoCategory(name);
    state.items.push({id:uid(),name:titleCase(name),category:cat,location:toGro?"grocery":"pantry",percent:toGro?null:100,qty:"",checked:false,photo:null,exp:null,opened:null,store:"pantry",note:""});
    save(); renderAll();
    speak(`Added ${name} to your ${toGro?"grocery list":"pantry"}.`);
    toast(`✓ “${titleCase(name)}” added to ${toGro?"grocery":"pantry"} (${cat})`,"good");
    return;
  }

  vlabel(`🤔 Didn't catch that — try again`);
  toast("Didn't recognize that command","warn");
}
function titleCase(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
function speak(text){ try{ const u=new SpeechSynthesisUtterance(text); u.rate=1; speechSynthesis.speak(u); }catch(e){} }

/* ============================================================
   SWIPE-DOWN / TAP-HANDLE TO CLOSE SHEETS
   ============================================================ */
function enableSwipeClose(sheet, closeFn){
  let startY=0, startX=0, curY=0, dragging=false, locked=false;
  sheet.addEventListener("touchstart",(e)=>{
    if(sheet.scrollTop>0){ dragging=false; return; }   // let content scroll instead
    dragging=true; locked=false;
    startY=curY=e.touches[0].clientY; startX=e.touches[0].clientX;
    sheet.style.transition="none";
  },{passive:true});
  sheet.addEventListener("touchmove",(e)=>{
    if(!dragging) return;
    const y=e.touches[0].clientY, x=e.touches[0].clientX;
    const dy=y-startY, dx=x-startX;
    if(!locked){
      // decide axis: a mostly-horizontal gesture is ignored (up/down only)
      if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>8){ dragging=false; sheet.style.transform=""; return; }
      if(Math.abs(dy)>8) locked=true;
    }
    curY=y;
    if(dy>0){ sheet.style.transform=`translateY(${dy}px)`; if(dy>6 && e.cancelable) e.preventDefault(); }
    else { dragging=false; sheet.style.transform=""; }   // upward = normal scroll
  },{passive:false});
  const finish=()=>{
    if(!dragging) return; dragging=false;
    const dy=curY-startY;
    sheet.style.transition="transform .2s ease";
    if(dy>110){ sheet.style.transform="translateY(100%)"; setTimeout(()=>{ closeFn(); sheet.style.transform=""; sheet.style.transition=""; },190); }
    else { sheet.style.transform=""; }
  };
  sheet.addEventListener("touchend",finish);
  sheet.addEventListener("touchcancel",finish);
  const grab=sheet.querySelector(".grab");
  if(grab) grab.addEventListener("click",closeFn);
}
enableSwipeClose($("#itemSheet"), closeItemSheet);
enableSwipeClose($("#noteScrim .sheet"), ()=>noteScrim.classList.remove("on"));

/* ============================================================
   INIT
   ============================================================ */
load();
switchTab("pantry");
renderAll();

// keep freshness fresh across midnight
setInterval(renderAll, 60*60*1000);
</script>
